# Perfil dos testes: H2 em memória no lugar do PostgreSQL.
#
# Não há Docker nesta máquina, então Testcontainers não é opção. A consequência
# a assumir: as migrations do Flyway NÃO são exercitadas por teste. O schema aqui
# é gerado a partir das entidades. Erro de sintaxe numa migration só aparece
# contra um PostgreSQL de verdade — rode `flyway:migrate` num banco descartável
# antes de publicar.
spring:
  datasource:
    url: "jdbc:h2:mem:soulie;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1"
    username: "sa"
    password: ""
    driver-class-name: "org.h2.Driver"
  flyway:
    # As migrations usam sintaxe exclusiva do PostgreSQL (a V20 faz
    # ALTER COLUMN ... TYPE ... USING CASE, que o H2 não entende).
    enabled: false
  jpa:
    show-sql: false
    hibernate:
      # O schema vem das entidades, não das migrations.
      ddl-auto: create-drop
    properties:
      hibernate:
        # Necessário: "level" (Avatar) e "date" (HistoryPoints) são palavras
        # reservadas no H2. Sem isto o schema nem é criado.
        globally_quoted_identifiers: true
  rabbitmq:
    host: "localhost"
    port: 5672
    username: "guest"
    password: "guest"
    listener:
      simple:
        # Não há broker nos testes. Sem isto o container de listener fica
        # tentando conectar em laço e enche o log de erro.
        auto-startup: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

api:
  security:
    token:
      secret_jwt: "segredo-apenas-de-teste-nao-usar-em-nenhum-ambiente-real"
      expiration: "PT2H"
  cors:
    allowed-origins: "http://localhost:3000"

logging:
  level:
    org.hibernate.SQL: WARN

soulie:
  storage:
    # Valores de fachada: nenhum teste chama o bucket de verdade. Existem porque
    # o bean do storage é construído na subida do contexto.
    endpoint: "http://localhost:9000"
    region: "auto"
    bucket: "soulie-test"
    access-key: "test"
    secret-key: "test"
    public-base-url: ""
  ai:
    url: ""
    api-key: ""
    webhook-enabled: false
    webhook-secret: "segredo-de-teste-do-webhook-com-tamanho-suficiente"

  cloudflare:
    enabled: false
  ratelimit:
    # Desligado por padrão nos testes: cada classe de teste faz dezenas de
    # chamadas e bateria no limite. Os testes do próprio rate limit ligam
    # explicitamente.
    enabled: false
